<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pokédex — buscador de Pokémon con estadísticas</title>
<meta name="description" content="Pokédex con buscador por nombre sobre los 1351 Pokémon de PokeAPI: imagen oficial, tipos y estadísticas base. Interfaz limpia y oscura.">
<meta name="color-scheme" content="dark">
<link rel="canonical" href="https://tonatiuhliera.com/pokedex/">
<link rel="stylesheet" href="pokedex.css">
</head>
<body>

<header>
  <div class="header-in">
    <a class="back" href="tonatiuhliera.com">
      <span aria-hidden="true">←</span> Volver al inicio
    </a>

    <div class="title-row">
      <h1><span class="dot">●</span> Pokédex</h1>
      <p class="sub">1351 Pokémon · imagen oficial, tipos y estadísticas base · datos de <a href="https://pokeapi.co/" target="_blank" rel="noopener">PokeAPI</a></p>
    </div>

    <div class="toolbar">
      <div>
        <div class="search">
          <svg class="lens" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.6-3.6"></path>
          </svg>
          <label for="q" hidden>Buscar Pokémon por nombre o número</label>
          <input id="q" type="search" autocomplete="off" spellcheck="false"
                 placeholder="Buscar por nombre o número…" aria-label="Buscar Pokémon por nombre o número">
          <span class="kbd" aria-hidden="true">Ctrl K</span>
          <button class="clear" id="clear" type="button" title="Limpiar búsqueda" aria-label="Limpiar búsqueda" hidden>×</button>
        </div>
        <p class="hint" id="hint" role="status" aria-live="polite">Cargando el catálogo…</p>
      </div>

      <div class="controls">
        <label for="pageSize">Por página</label>
        <select id="pageSize" aria-label="Resultados por página">
          <option value="24">24</option>
          <option value="48" selected>48</option>
          <option value="96">96</option>
        </select>
        <button id="prev" type="button">‹ Anterior</button>
        <button id="next" type="button">Siguiente ›</button>
      </div>
    </div>
  </div>
</header>

<nav class="types" id="typeChips" aria-label="Filtrar por tipo"></nav>

<main>
  <div class="grid" id="grid" aria-busy="true"></div>
</main>

<footer class="pager">
  <div class="pager-in">
    <button id="prev2" type="button">‹ Anterior</button>
    <span class="status" id="pageStatus">—</span>
    <button id="next2" type="button">Siguiente ›</button>
    <label for="pageJump" class="status">Ir a</label>
    <input id="pageJump" type="number" min="1" step="1" value="1" aria-label="Ir a la página">
    <button id="go" type="button">Ir</button>
  </div>
</footer>

<dialog id="detail" aria-labelledby="dName">
  <div class="dhead">
    <button class="dclose" id="dClose" type="button" title="Cerrar" aria-label="Cerrar detalle">✕</button>
    <div class="dart" id="dArt"></div>
    <div class="dinfo">
      <span class="pid" id="dId">—</span>
      <h2 id="dName">—</h2>
      <div class="tchips" id="dTypes"></div>
    </div>
  </div>
  <div class="dbody" id="dBody"></div>
</dialog>

<script src="pokedex.js"></script>
</body>
</html>
